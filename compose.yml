services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
    depends_on:
      - db

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      API_URL: http://server:3000
    depends_on:
      - server

volumes:
  db-data: